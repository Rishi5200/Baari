spring:
  application:
    name: baari
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${BAARI_DB_URL:jdbc:postgresql://localhost:5432/baari}
    username: ${BAARI_DB_USER:baari}
    password: ${BAARI_DB_PASSWORD:baari}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${BAARI_REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${BAARI_KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      # A new consumer group must read the topic from its start, or events sent before it first
      # joined would be lost.
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail a send quickly when Kafka is away: the outbox keeps the row and the relay retries.
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
  session:
    timeout: 12h # idle timeout for staff sessions (PLAN §9.1)
    data:
      redis:
        namespace: baari:session

baari:
  queue: # PLAN §14; the same values are the defaults in QueueProperties
    default-service-minutes: 6
    no-show-grace-minutes: 3
    recall-insert-offset: 2
    max-consecutive-priority: 2
    max-open-tokens: 300
  notifications: # PLAN §14
    notify-ahead-count: 3 # told to come back when at position 3 or better
    log-enabled: true # the log channel; the real channels need their own settings
    max-attempts: 5
  ml: # PLAN §8.6, §14
    min-training-samples: 300 # finished consultations a clinic needs before a model is trained
    train-hour: 2 # nightly training at 02:30 clinic time
  privacy:
    # Required outside dev/test; empty here so startup fails with a clear message if unset.
    data-key: ${BAARI_DATA_KEY:}         # base64 of 32 random bytes (AES-256)
    phone-pepper: ${BAARI_PHONE_PEPPER:} # base64 of at least 32 random bytes (HMAC)

logging:
  level:
    org.tribuo: WARN # Tribuo logs every 1000 training steps at INFO

server:
  # Behind Caddy: use X-Forwarded-* so generated links (poster) carry the public https host.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
