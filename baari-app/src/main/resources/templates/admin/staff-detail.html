<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Manage login')}"></head>
<body>
<header th:replace="~{layout :: topbar}"></header>
<main class="narrow">
  <h1 th:text="${user.username()}">ravi</h1>
  <th:block th:replace="~{layout :: flash}"></th:block>
  <p>Role: <strong th:text="${user.role()}">RECEPTIONIST</strong> ·
    <span th:text="${user.enabled()} ? 'Enabled' : 'Disabled'">Enabled</span></p>

  <h2>Change role</h2>
  <form method="post" th:action="@{/admin/staff/{id}/role(id=${user.id()})}">
    <label>Role
      <select name="role">
        <option th:each="r : ${clinicRoles}" th:value="${r}" th:text="${r}"
                th:selected="${r == user.role()}">RECEPTIONIST</option>
      </select>
    </label>
    <label>Doctor (only for the DOCTOR role)
      <select name="doctorId">
        <option value="">—</option>
        <option th:each="d : ${doctors}" th:value="${d.id()}" th:text="${d.name()}"
                th:selected="${d.id() == user.doctorId()}">Dr. Name</option>
      </select>
    </label>
    <button type="submit">Change role</button>
  </form>

  <h2>Reset password</h2>
  <form method="post" th:action="@{/admin/staff/{id}/password(id=${user.id()})}">
    <label>New password (8–72 characters)
      <input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
    </label>
    <button type="submit">Reset password</button>
  </form>

  <h2 th:text="${user.enabled()} ? 'Disable login' : 'Enable login'">Disable login</h2>
  <form method="post" th:action="@{/admin/staff/{id}/enabled(id=${user.id()})}">
    <input type="hidden" name="enabled" th:value="${!user.enabled()}">
    <button type="submit" th:text="${user.enabled()} ? 'Disable' : 'Enable'">Disable</button>
  </form>

  <p><a th:href="@{/admin/staff}">Back to staff logins</a></p>
</main>
</body>
</html>
