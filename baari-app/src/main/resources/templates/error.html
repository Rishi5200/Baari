<!DOCTYPE html>
<!--/* Used by WebErrorAdvice and by Spring Boot's /error page (403 from URL rules, 404, 500). */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Error')}"></head>
<body>
<header th:replace="~{layout :: topbar}"></header>
<main class="narrow">
  <h1><span th:text="${status}">500</span> <span th:text="${error}">Error</span></h1>
  <p th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">Something went wrong.</p>
  <p th:if="${status == 403 and (message == null or #strings.isEmpty(message))}">You are not allowed to open this page.</p>
  <p><a th:href="@{/}">Back to the start page</a></p>
</main>
</body>
</html>
