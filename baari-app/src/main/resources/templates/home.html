<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baari</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="narrow">
  <h1>Baari</h1>

    <button type="submit">Log out</button>
  </form>
</main>
</body>
</html>
