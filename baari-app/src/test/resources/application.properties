# Kafka consumers run only in the test classes that need them (they turn this back on).
# Cached Spring contexts stay alive for the whole run; consumers in all of them would take
# each other's messages.
spring.kafka.listener.auto-startup=false

# Every test request comes from the same address, so per-IP limits would trip across tests.
# RateLimitIT turns them back on with small limits.
baari.rate-limit.enabled=false
